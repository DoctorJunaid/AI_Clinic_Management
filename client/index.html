<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAYLANI CLINIC - AI Clinic Management SaaS</title>
    <!-- Stitch UI integration: Tailwind CSS & premium typography -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#1a1c1c",
                        "surface-tint": "#5f5e5e",
                        "inverse-on-surface": "#f0f1f1",
                        "on-tertiary-fixed-variant": "#444b00",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#add461",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#7e8b00",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#1c1b1b",
                        "secondary-container": "#c8f17a",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#1a1e00",
                        "on-primary-fixed": "#1c1b1b",
                        "inverse-surface": "#2f3131",
                        "on-primary-container": "#858383",
                        "on-primary-fixed-variant": "#474646",
                        "secondary": "#496800",
                        "primary": "#000000",
                        "surface-variant": "#e2e2e2",

                        "outline-variant": "#c4c7c7",

                        "surface-container": "#eeeeee",
                        "background": "#f9f9f9",
                        "surface": "#f9f9f9",
                        "surface-dim": "#dadada",
                        "tertiary": "#000000",
                        "surface-bright": "#f9f9f9",

                        "widget-gap": "16px",
                        "margin-lg": "48px",
                        "unit": "8px",
                        "margin-md": "24px",
                        "gutter": "24px",
                        "margin-sm": "12px",
                        "container-padding": "40px"
                    },
                    "fontFamily": {
                        "body-md": ["Outfit", "sans-serif"],
                        "headline-xl": ["Playfair Display", "serif"],
                        "headline-lg": ["Outfit", "sans-serif"],
                        "headline-lg-mobile": ["Outfit", "sans-serif"],
                        "nav-link": ["Outfit", "sans-serif"],
                        "label-sm": ["JetBrains Mono"]

                    "fontSize": {
                        "body-md": ["15px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],

                        "label-sm": ["12px", { "lineHeight": "1.5", "letterSpacing": "0.05em", "fontWeight": "500" }]

                }
            }
        }

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .text-gradient {
            background: linear-gradient(90deg, #1a1c1c 0%, #5f5e5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
